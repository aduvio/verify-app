# Manual compile only. No triggers, signing identities, publishing or integrations.
workflows:
  ios-meta-unsigned-debug:
    name: iOS Meta unsigned debug compile
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      flutter: 3.47.2
      xcode: '26.6'
    scripts:
      - name: Record tool versions
        script: |
          set -euo pipefail
          flutter --version
          xcodebuild -version
          xcrun swift --version
      - name: Resolve Flutter dependencies
        script: flutter pub get --enforce-lockfile
      - name: Windows-compatible regression checks
        script: |
          set -euo pipefail
          flutter analyze --no-pub
          flutter test --no-pub
      - name: Generate Flutter iOS configuration and resolve Swift packages
        script: |
          set -euo pipefail
          flutter build ios --debug --config-only --no-codesign --no-pub --dart-define=WEARABLES_TEST=true
          xcodebuild -resolvePackageDependencies -workspace ios/Runner.xcworkspace -scheme Runner -configuration Debug
      - name: Compile unsigned iPhone application
        script: |
          set -euo pipefail
          flutter build ios --debug --no-codesign --no-pub --dart-define=WEARABLES_TEST=true
    artifacts:
      - build/ios/iphoneos/Runner.app
      - ios/Runner.xcworkspace/xcshareddata/swiftpm/Package.resolved
